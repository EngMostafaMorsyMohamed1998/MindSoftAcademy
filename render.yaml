services:
  - type: web
    name: mindsoft-academy
    runtime: node
    plan: free
    region: frankfurt
    # The build needs TypeScript, Tailwind, and tsx, which live in devDependencies,
    # and the host sets NODE_ENV=production, so ask for them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mindsoftacademy.com
      # Point this at a mounted disk to keep the class store across restarts.
      - key: DATA_DIR
        value: /var/data
      # Postgres. Set the pooled URI here and the direct URI on DIRECT_URL.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: TEACHER_PIN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: NEXT_PUBLIC_TELEGRAM_BOT
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
